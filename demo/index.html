<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0578ff">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="ume opera">
  <link id="siteFavicon" rel="icon" href="https://i.ibb.co/rfzm8PY1/ume.webp">
  <link id="appleTouchIcon" rel="apple-touch-icon" sizes="200x200" href="https://i.ibb.co/ZzBFXYyX/IMG-4120.png">
  <link id="canonicalLink" rel="canonical" href="https://jisungeda55.github.io/music/ume/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="ume Opera">
  <meta property="og:description" content="ALT Music">
  <meta property="og:site_name" content="ume Opera">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:url" content="https://jisungeda55.github.io/music/ume/">
  <meta property="og:image" content="https://i.ibb.co/8Lb0GTQF/ume-OG.webp">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ume Opera">
  <meta name="twitter:description" content="ALT Music">
  <meta name="twitter:image" content="https://i.ibb.co/8Lb0GTQF/ume-OG.webp">
  <title>ume Opera</title>
  <style>
    @font-face {
      font-family: 'Bithumb Gothic Original';
      src: url('https://www.bithumbcorp.com/module/fonts/BithumbGothic-Original.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Aggravo';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SBAggroM.woff') format('woff');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'LineSeed';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Th.woff2') format('woff2');
      font-weight: 100;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'LineSeed';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Rg.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'LineSeed';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Bd.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #090a0f;
      --panel: #12131a;
      --panel-2: #1a1b24;
      --line: rgba(255,255,255,.09);
      --text: #f7f7fa;
      --muted: #999ba9;
      --accent: #0578ff;
      --accent-soft: rgba(5,120,255,.14);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: 'LineSeed', "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% -10%, rgba(5,120,255,.13), transparent 42%),
        radial-gradient(ellipse at 110% 70%, rgba(100,80,180,.10), transparent 38%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    button { color: inherit; font: inherit; }

    .app-shell {
      position: relative;
      display: grid;
      grid-template-rows: minmax(34px, 5dvh) minmax(0, 27dvh) minmax(118px, 19dvh) minmax(0, 1fr);
      width: min(100%, 520px);
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      overflow: hidden;
      isolation: isolate;
    }
    .app-shell::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,.018), transparent 30%, rgba(255,255,255,.012));
    }

    /* 1/10: 작은 상단 브랜드 영역 */
    .topbar {
      grid-row: 1 / 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      min-height: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .18em;
      color: #e7e7ed;
    }
    .brand-mark {
      display: block;
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      object-fit: cover;
      border-radius: 8px;
      background: rgba(255,255,255,.04);
    }
    .brand-mark[hidden] { display: none !important; }
    .topbar-label {
      color: #747684;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    /* 2~5/10: YouTube 영상 영역 */
    .player-zone {
      grid-row: 2 / 3;
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 0 10px 2px;
    }
    .video-frame {
      position: relative;
      width: min(100%, calc((25dvh - 6px) * 1.7777778));
      max-height: calc(25dvh - 6px);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      box-shadow: 0 18px 55px rgba(0,0,0,.42), 0 0 0 1px rgba(255,255,255,.015);
    }
    .video-frame iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
    /* 6~7/10: 아티스트 / 제목 */
    .track-info {
      grid-row: 3 / 4;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4px 18px 8px;
    }
    .eyebrow {
      margin-bottom: 7px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .18em;
    }
    .current-title {
      max-width: 100%;
      margin: 0;
      font-family: 'Bithumb Gothic Original', 'Aggravo', 'LineSeed', "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      font-size: clamp(19px, 5.3vw, 25px);
      line-height: 1.32;
      letter-spacing: -.035em;
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    .current-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    /* 아티스트 행은 JSON의 항목 수에 따라 동적으로 늘어납니다. */
    .library-zone {
      grid-row: 4 / 5;
      display: grid;
      grid-template-rows: auto 30px minmax(0, 0fr);
      min-width: 0;
      min-height: 0;
      padding: 0 12px calc(4px + var(--safe-bottom));
      transition: grid-template-rows .34s cubic-bezier(.2,.75,.25,1);
    }
    .library-zone.is-open { grid-template-rows: auto 30px minmax(0, 1fr); }
    .artist-tabs {
      display: grid;
      align-content: start;
      gap: 6px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      transition: max-height .32s cubic-bezier(.2,.75,.25,1), opacity .2s ease;
    }
    .artist-row {
      display: grid;
      grid-template-columns: repeat(var(--row-count, 5), minmax(0, 1fr));
      gap: 6px;
      min-width: 0;
      min-height: 0;
      max-height: 44px;
      overflow: hidden;
      opacity: 1;
      transition: max-height .32s cubic-bezier(.2,.75,.25,1), opacity .2s ease;
    }
    .artist-tabs.is-collapsed .artist-row:not(.is-selected-row) {
      max-height: 0;
      opacity: 0;
      pointer-events: none;
    }
    .artist-tabs-placeholder {
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      padding: 10px 0;
    }
    .artist-tools {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
    }
    .artist-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 27px;
      padding: 3px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #b8bac6;
      background: rgba(255,255,255,.035);
      font-size: 10px;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease, color .2s ease;
    }
    .artist-toggle:disabled { opacity: .35; cursor: default; }
    .artist-toggle svg { transition: transform .25s ease; }
    .artist-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
    .artist-button {
      position: relative;
      width: 100%;
      min-width: 0;
      min-height: 38px;
      padding: 0 6px;
      white-space: nowrap;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: #a7a8b3;
      background: rgba(255,255,255,.035);
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      transition: background .22s ease, color .22s ease, border-color .22s ease, transform .22s ease;
    }
    .artist-button:active { transform: scale(.97); }
    .artist-button:disabled { opacity: .48; cursor: wait; }
    .artist-button[aria-expanded="true"] {
      color: #fff;
      border-color: rgba(5,120,255,.55);
      background: var(--accent-soft);
    }
    .artist-button[aria-expanded="true"]::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 50%;
      width: 18px;
      height: 2px;
      border-radius: 2px;
      background: var(--accent);
      transform: translateX(-50%);
    }
    .playlist-panel {
      min-height: 0;
      overflow: hidden;
      border-top: 1px solid transparent;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .2s ease, transform .28s ease, border-color .28s ease;
      pointer-events: none;
    }
    .is-open .playlist-panel {
      border-top-color: var(--line);
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .playlist-inner {
      height: 100%;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 8px 1px 2px;
      scrollbar-width: thin;
      scrollbar-color: #444550 transparent;
    }
    .playlist-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 1px 3px 8px;
    }
    .playlist-heading strong {
      font-size: 11px;
      letter-spacing: .04em;
    }
    .playlist-heading span {
      color: var(--muted);
      font-size: 10px;
    }
    .song-list { display: grid; gap: 5px; }
    .song-button {
      display: grid;
      grid-template-columns: 27px minmax(0, 1fr) 26px;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 47px;
      padding: 7px 11px;
      text-align: left;
      border: 1px solid transparent;
      border-radius: 11px;
      background: rgba(255,255,255,.035);
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }
    .song-button:active { transform: scale(.99); }
    .song-button:disabled { opacity: .72; cursor: not-allowed; }
    .song-button.is-active {
      border-color: rgba(5,120,255,.32);
      background: linear-gradient(90deg, rgba(5,120,255,.14), rgba(5,120,255,.045));
    }
    .song-number {
      color: #777987;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }
    .song-copy { min-width: 0; }
    .song-title {
      overflow: hidden;
      color: #e8e8ed;
      font-size: 12px;
      font-weight: 750;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .song-artist {
      margin-top: 3px;
      overflow: hidden;
      color: #878995;
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .song-warning {
      display: block;
      margin-top: 3px;
      color: #ffbd69;
      font-size: 9px;
      line-height: 1.35;
    }
    .song-state {
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      border-radius: 8px;
      color: #8a8b97;
      background: rgba(255,255,255,.045);
    }
    .song-button.is-active .song-state {
      color: var(--accent);
      background: var(--accent-soft);
    }
    .empty-state {
      padding: 22px 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }
    .empty-state code {
      color: #e6b2a8;
      font-size: 11px;
    }

    /* iPhone 등 세로형 모바일: 영상 주변과 제목 영역의 과도한 여백을 줄여 곡 목록을 확보 */
    @media (max-width: 600px) and (orientation: portrait) {
      .topbar { padding: 0 16px; }
      .brand { gap: 8px; font-size: 10px; }
      .brand-mark { width: 27px; height: 27px; flex-basis: 27px; }
      .topbar-label { font-size: 9px; letter-spacing: .08em; }
      .player-zone { padding: 0 8px; }
      .video-frame { width: min(100%, calc((32dvh - 6px) * 1.7777778)); max-height: calc(32dvh - 6px); border-radius: 13px; }
      .track-info { padding: 0 12px 2px; }
      .eyebrow { margin-bottom: 3px; font-size: 9px; }
      .current-title { font-size: clamp(18px, 5vw, 23px); line-height: 1.2; }
      .current-subtitle { margin-top: 3px; font-size: 11px; }
      .library-zone { padding-right: 10px; padding-left: 10px; }
      .artist-tabs { gap: 4px; }
      .artist-row { gap: 4px; }
      .artist-button { min-height: 34px; padding-top: 5px; padding-bottom: 5px; }
      .artist-tools { height: 26px; }
      .artist-toggle { min-height: 25px; padding: 2px 10px; }
      .song-button { min-height: 42px; padding-top: 7px; padding-bottom: 7px; }
    }

    @media (max-height: 680px) {
      .topbar { padding: 0 17px; }
      .player-zone { padding-top: 0; padding-bottom: 2px; }
      .video-frame { width: min(100%, calc((23dvh - 4px) * 1.7777778)); max-height: calc(23dvh - 4px); }
      .track-info { padding-top: 2px; padding-bottom: 5px; }
      .eyebrow { margin-bottom: 6px; }
      .current-subtitle { margin-top: 4px; }
      .library-zone { padding-right: 10px; padding-left: 10px; }
      .artist-button { min-height: 32px; }
      .artist-row { gap: 4px; }
      .artist-tabs { gap: 4px; }
      .song-button { min-height: 40px; }
    }
    /* ============================================================
       넓은 가로 화면 레이아웃 (PC / 태블릿 가로 / 폴더블 가로)
       5열 × 3행 그리드:
       - 열 1~3, 행 1~2: YouTube 영상
       - 열 1~3, 행 3: 아티스트 / 제목
       - 열 4~5, 행 1~3: 아티스트 버튼 및 재생목록
       세로 화면은 위의 기존 10분할 레이아웃을 그대로 사용합니다.
       ============================================================ */
    @media (orientation: landscape) and (min-width: 680px) {
      .app-shell {
        width: 100%;
        max-width: none;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        grid-template-rows: minmax(0, 1fr) minmax(0, 1fr) minmax(0, .82fr);
      }

      /* 브랜드 마크는 그리드 칸을 차지하지 않는 오버레이로 표시합니다.
         따라서 5×3 레이아웃을 유지하면서 가로 화면에서도 로고가 보입니다. */
      .topbar {
        position: absolute;
        z-index: 5;
        top: auto;
        left: auto;
        right: 8px;
        bottom: calc(var(--safe-bottom) + 8px);
        display: flex;
        width: auto;
        height: auto;
        min-height: 0;
        padding: 0;
        pointer-events: none;
      }
      .brand {
        gap: 7px;
        padding: 5px 9px;
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 10px;
        background: rgba(9,10,15,.76);
        box-shadow: 0 4px 16px rgba(0,0,0,.2);
        backdrop-filter: blur(10px);
        font-size: 10px;
        letter-spacing: .08em;
        pointer-events: none;
      }
      .brand-mark {
        width: 24px;
        height: 24px;
        flex-basis: 24px;
        border-radius: 6px;
      }
      .topbar-label { display: none; }
      .player-zone {
        grid-column: 1 / 4;
        grid-row: 1 / 3;
        padding: 5px 8px;
      }
      .video-frame {
        width: min(100%, 104dvh);
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 14px;
      }

      .track-info {
        grid-column: 1 / 4;
        grid-row: 3 / 4;
        /* 제목 영역의 위아래 여백을 줄여 그리드의 축소된 행을 효율적으로 씁니다. */
        padding: 2px clamp(10px, 1.8vw, 24px);
      }
      .eyebrow {
        margin-bottom: 6px;
        font-size: clamp(9px, 1.05vw, 11px);
      }
      .current-title {
        font-size: clamp(16px, 2.3vw, 30px);
        line-height: 1.25;
      }
      .current-subtitle {
        margin-top: 5px;
        font-size: clamp(10px, 1.15vw, 13px);
      }

      .library-zone {
        grid-column: 4 / 6;
        grid-row: 1 / 4;
        grid-template-rows: minmax(0, auto) 30px minmax(0, 0fr);
        padding: calc(6px + var(--safe-top)) 6px calc(6px + var(--safe-bottom));
        border-left: 1px solid var(--line);
        background: rgba(12, 13, 19, .62);
      }
      .library-zone.is-open { grid-template-rows: minmax(0, auto) 30px minmax(0, 1fr); }
      .artist-tabs { gap: 5px; }
      .artist-row { gap: 5px; }
      .artist-button {
        min-height: 32px;
        padding: 0 4px;
        border-radius: 9px;
        font-size: clamp(10px, 1.1vw, 13px);
      }
      .artist-toggle { min-height: 25px; }
      /* 우측 하단 브랜드가 마지막 곡을 가리지 않도록 스크롤 끝 여백을 확보합니다. */
      .playlist-inner { padding-top: 10px; padding-bottom: 48px; }
      .playlist-heading { padding-bottom: 9px; }
      .song-list { gap: 6px; }
      .song-button {
        grid-template-columns: 24px minmax(0, 1fr) 24px;
        gap: 7px;
        min-height: 44px;
        padding: 7px 8px;
      }
      .song-title { font-size: clamp(11px, 1.05vw, 13px); }
      .song-artist { font-size: clamp(9px, .9vw, 11px); }
      .empty-state { padding: 18px 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="app-shell" aria-label="음악 플레이어">
    <header class="topbar">
      <div class="brand" aria-label="ume Opera">
        <img class="brand-mark" id="brandMarkImage" alt="" aria-hidden="true" hidden>
        <span>ume Opera</span>
      </div>
      <div class="topbar-label" id="playlistStatus" role="status" aria-live="polite">PLAYLIST LOADING...</div>
    </header>

    <section class="player-zone" aria-label="영상 플레이어">
      <div class="video-frame">
        <iframe
          id="youtubePlayer"
          src="about:blank"
          title="YouTube music player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      </div>
    </section>

    <section class="track-info" aria-live="polite" aria-atomic="true">
      <div class="eyebrow">NOW SELECTED</div>
      <h1 class="current-title" id="currentTitle">재생목록을 불러오는 중</h1>
      <div class="current-subtitle" id="currentSubtitle">외부 playlist.json에서 곡 정보를 불러오고 있습니다.</div>
    </section>

    <section class="library-zone" id="libraryZone" aria-label="아티스트 및 재생목록">
      <nav class="artist-tabs" id="artistTabs" aria-label="아티스트 선택">
        <span class="artist-tabs-placeholder">재생목록 불러오는 중…</span>
      </nav>
      <div class="artist-tools">
        <button class="artist-toggle" id="artistToggle" type="button" aria-expanded="true" aria-controls="artistTabs" disabled>
          <span id="artistToggleLabel">아티스트 전체 보기</span>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="m2 4.5 4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="playlist-panel" id="playlistPanel">
        <div class="playlist-inner" id="playlistInner">
          <div class="playlist-heading">
            <strong id="playlistArtistName">재생목록</strong>
            <span id="playlistCount">LOADING</span>
          </div>
          <div class="song-list" id="songList"><div class="empty-state">외부 JSON 재생목록을 불러오는 중입니다.</div></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    'use strict';

    /* ============================================================
       ume Opera 사이트 설정
       - BRAND_IMAGE_URL: 헤더의 정사각형 WEBP 브랜드 이미지.
       - FAVICON_URL: 파비콘 URL.
       - OPENGRAPH_CONFIG: 검색 설명 및 SNS 공유 미리보기 설정.
       - 빈 문자열은 기존 <head> 메타데이터를 삭제하지 않고 기존 값을 유지합니다.
       - SNS 공유 크롤러 호환성을 위해 <head>의 초기 메타데이터도 같은 값으로
         유지해 주세요. 일부 크롤러는 JavaScript를 실행하지 않습니다.
       ============================================================ */
    const BRAND_IMAGE_URL = 'https://i.ibb.co/rfzm8PY1/ume.webp';
    const FAVICON_URL = 'https://i.ibb.co/rfzm8PY1/ume.webp';
    const OPENGRAPH_CONFIG = {
      title: 'ume Opera',
      pageDescription: 'ume opera',
      description: 'ALT Music',
      type: 'website',
      siteName: 'ume Opera',
      locale: 'ko_KR',
      url: 'https://jisungeda55.github.io/music/ume/',
      imageUrl: 'https://i.ibb.co/8Lb0GTQF/ume-OG.webp',
      twitterCard: 'summary_large_image'
    };

    function setMetaContent(attribute, key, value) {
      // 빈 값이면 기존 <head> 값을 보존합니다. 빈 content로 덮거나 제거하지 않습니다.
      if (typeof value !== 'string' || !value.trim()) return;

      const selector = `meta[${attribute}="${key}"]`;
      let element = document.head.querySelector(selector);
      if (!element) {
        element = document.createElement('meta');
        element.setAttribute(attribute, key);
        document.head.appendChild(element);
      }
      element.setAttribute('content', value.trim());
    }

    function applySiteConfiguration() {
      const brandImage = document.getElementById('brandMarkImage');
      if (BRAND_IMAGE_URL.trim()) {
        brandImage.src = BRAND_IMAGE_URL.trim();
        brandImage.hidden = false;
        brandImage.addEventListener('error', () => {
          brandImage.hidden = true;
          console.warn('[ume Opera] 브랜드 이미지 URL을 불러오지 못했습니다. BRAND_IMAGE_URL을 확인하세요.');
        }, { once: true });
      } else {
        // 이미지 URL이 비어 있으면 이미지 엘리먼트만 숨기고 텍스트 로고를 유지합니다.
        brandImage.hidden = true;
      }

      const favicon = document.getElementById('siteFavicon');
      const appleTouchIcon = document.getElementById('appleTouchIcon');
      if (FAVICON_URL.trim()) {
        favicon.href = FAVICON_URL.trim();
        if (appleTouchIcon) appleTouchIcon.href = FAVICON_URL.trim();
      }
      // FAVICON_URL이 비어 있으면 HTML <head>에 설정된 기본 파비콘을 유지합니다.

      const config = OPENGRAPH_CONFIG;
      if (typeof config.title === 'string' && config.title.trim()) {
        document.title = config.title.trim();
      }
      setMetaContent('name', 'description', config.pageDescription || config.description);
      setMetaContent('property', 'og:type', config.type || 'website');
      setMetaContent('property', 'og:title', config.title);
      setMetaContent('property', 'og:description', config.description);
      setMetaContent('property', 'og:site_name', config.siteName || config.title);
      setMetaContent('property', 'og:locale', config.locale || 'ko_KR');
      setMetaContent('property', 'og:url', config.url);
      setMetaContent('property', 'og:image', config.imageUrl);
      setMetaContent('name', 'twitter:card', config.twitterCard || 'summary_large_image');
      setMetaContent('name', 'twitter:title', config.title);
      setMetaContent('name', 'twitter:description', config.description);
      setMetaContent('name', 'twitter:image', config.imageUrl);

      const canonicalLink = document.getElementById('canonicalLink');
      if (config.url && config.url.trim()) {
        canonicalLink.href = config.url.trim();
      }
      // config.url이 비어 있으면 기존 canonical href를 유지합니다.
    }

    applySiteConfiguration();

    /* ============================================================
       외부 JSON 재생목록 설정
       - 아래 GitHub Raw URL에서 JSON을 가져옵니다.
       - 아티스트 버튼, 버튼 이름, 기본 아티스트명, 곡 목록은 전부 불러온 JSON만 기준으로 구성합니다.
       - HTML에는 아티스트 ID/이름의 기본 목록이나 대체 아티스트 데이터가 없습니다.
       - JSON의 artists에 항목을 추가·수정·삭제하면 해당 JSON이 화면 구성의 단일 기준 데이터가 됩니다.
       - JSON 위치를 변경하려면 PLAYLIST_JSON_URL 값만 바꾸세요.
       - 원격 URL은 CORS 요청을 허용해야 합니다. file://로 직접 열면 fetch가
         차단될 수 있으므로 GitHub Pages 등 HTTP(S) 주소로 실행하는 것을 권장합니다.
       ============================================================ */
    const PLAYLIST_JSON_URL = 'https://raw.githubusercontent.com/JisungEda55/music/refs/heads/main/ume/playlist.json';

    // 아티스트 ID를 HTML에 고정하지 않습니다. playlist.json의 artists 키가 버튼이 됩니다.
    let PLAYLISTS = Object.create(null);
    let ARTIST_ORDER = [];
    let artistButtons = [];
    let playlistWarnings = [];
    let playlistLoadError = null;

    const player = document.getElementById('youtubePlayer');
    const libraryZone = document.getElementById('libraryZone');
    const artistTabs = document.getElementById('artistTabs');
    const artistToggle = document.getElementById('artistToggle');
    const artistToggleLabel = document.getElementById('artistToggleLabel');
    const appShell = document.querySelector('.app-shell');
    const songList = document.getElementById('songList');
    const playlistArtistName = document.getElementById('playlistArtistName');
    const playlistCount = document.getElementById('playlistCount');
    const currentTitle = document.getElementById('currentTitle');
    const currentSubtitle = document.getElementById('currentSubtitle');
    const playlistInner = document.getElementById('playlistInner');
    const playlistStatus = document.getElementById('playlistStatus');

    let activeArtistId = null;
    let activeTrackKey = null;
    let artistListExpanded = true;
    let artistRows = [];

    // videoId에는 11자리 ID 또는 일반적인 YouTube 링크를 입력할 수 있습니다.
    // 지원 예시:
    // - u5Ud4h9K8gs
    // - https://www.youtube.com/watch?v=y-rdBQSrzSs
    // - https://youtu.be/y-rdBQSrzSs
    // - https://www.youtube.com/embed/y-rdBQSrzSs
    // - https://www.youtube.com/shorts/y-rdBQSrzSs
    // - https://www.youtube.com/live/y-rdBQSrzSs
    function extractYouTubeVideoId(value) {
      if (typeof value !== 'string') return null;
      const input = value.trim();
      if (!input) return null;

      // 기존처럼 ID만 입력하는 형식도 지원합니다.
      if (/^[A-Za-z0-9_-]{11}$/.test(input)) return input;

      let url;
      try {
        url = new URL(input);
      } catch {
        // 프로토콜을 생략한 www.youtube.com/watch?v=... 형식도 허용합니다.
        try {
          url = new URL(`https://${input}`);
        } catch {
          return null;
        }
      }

      const hostname = url.hostname.toLowerCase().replace(/^www\./, '');
      const allowedHosts = new Set([
        'youtube.com', 'm.youtube.com', 'music.youtube.com',
        'youtube-nocookie.com', 'youtu.be'
      ]);
      if (!allowedHosts.has(hostname)) return null;

      let candidate = '';
      if (hostname === 'youtu.be') {
        candidate = url.pathname.split('/').filter(Boolean)[0] || '';
      } else {
        candidate = url.searchParams.get('v') || '';
        if (!candidate) {
          const match = url.pathname.match(/^\/(?:embed|shorts|live|v)\/([^/?#]+)/i);
          if (match) candidate = match[1];
        }
      }

      return /^[A-Za-z0-9_-]{11}$/.test(candidate) ? candidate : null;
    }

    function parsePlaylistJson(data) {
      // 이 객체만 재생목록의 원본입니다. HTML의 기본 아티스트 목록과 병합하지 않습니다.
      if (!data || typeof data !== 'object' || Array.isArray(data) ||
          !data.artists || typeof data.artists !== 'object' || Array.isArray(data.artists)) {
        throw new Error('JSON 최상위에 artists 객체가 필요합니다.');
      }

      const entries = Object.entries(data.artists);
      if (entries.length === 0) throw new Error('artists 객체에 아티스트를 한 명 이상 등록하세요.');

      const parsed = Object.create(null);
      const warnings = [];

      for (const [id, source] of entries) {
        // 아티스트 ID·버튼 이름·기본 아티스트명을 HTML의 고정값으로 보충하지 않습니다.
        // JSON에 정의된 값을 그대로 사용하고, 필수 항목이 빠졌으면 명확히 오류 처리합니다.
        if (!id.trim()) {
          throw new Error('artists 안에 비어 있는 아티스트 ID가 있습니다.');
        }
        if (!source || typeof source !== 'object' || Array.isArray(source)) {
          throw new Error(`artists.${id}는 객체여야 합니다.`);
        }

        const label = source.label;
        const artist = source.artist;
        if (typeof label !== 'string' || !label.trim()) {
          throw new Error(`artists.${id}.label이 없습니다. JSON에 버튼 표시 이름을 입력하세요.`);
        }
        if (typeof artist !== 'string' || !artist.trim()) {
          throw new Error(`artists.${id}.artist가 없습니다. JSON에 기본 아티스트명을 입력하세요.`);
        }
        if (!Array.isArray(source.songs)) {
          throw new Error(`artists.${id}.songs는 반드시 배열이어야 합니다.`);
        }

        const songs = [];
        source.songs.forEach((song, index) => {
          const itemLabel = `artists.${id}.songs[${index}]`;
          if (!song || typeof song !== 'object' || Array.isArray(song)) {
            warnings.push(`${itemLabel}: 곡 데이터가 객체가 아니어서 제외했습니다.`);
            return;
          }

          const title = typeof song.title === 'string' ? song.title.trim() : '';
          const rawVideoSource = typeof song.videoId === 'string' ? song.videoId.trim() : '';
          const normalizedVideoId = extractYouTubeVideoId(rawVideoSource);
          const songArtist = song.artist === undefined ? artist : song.artist;
          const startNumber = Number(song.start);

          if (!title) {
            warnings.push(`${itemLabel}: title이 비어 있어 제외했습니다.`);
            return;
          }
          if (song.start === '' || song.start === null || song.start === undefined ||
              !Number.isFinite(startNumber) || startNumber < 0) {
            warnings.push(`${itemLabel} (${title}): start는 0 이상의 숫자여야 해서 해당 곡을 제외했습니다.`);
            return;
          }
          if (typeof songArtist !== 'string' || !songArtist.trim()) {
            warnings.push(`${itemLabel} (${title}): artist가 비어 있어 제외했습니다.`);
            return;
          }

          const videoIdValid = Boolean(normalizedVideoId);
          if (!videoIdValid) {
            warnings.push(`${itemLabel} (${title}): videoId에 유효한 11자리 YouTube ID 또는 지원되는 YouTube URL을 입력하세요. 입력값: "${rawVideoSource || '(비어 있음)'}"`);
          }

          songs.push({
            title,
            artist: songArtist.trim(),
            // iframe에는 URL 전체가 아니라 추출된 ID만 전달합니다.
            videoId: normalizedVideoId || '',
            videoIdInput: rawVideoSource,
            videoIdValid,
            start: Math.floor(startNumber)
          });
        });

        parsed[id] = {
          label: label.trim(),
          artist: artist.trim(),
          songs
        };
      }
      return { playlists: parsed, warnings };
    }

    // 아티스트는 JSON 순서를 유지하되 5개 단위로 행을 만듭니다.
    // 마지막 행이 1개면 앞 행에 합쳐 6개로, 2개면 앞의 두 행에 하나씩 분배합니다.
    // 7개처럼 두 행에 분배할 수 없는 작은 경우에는 균등 분배해 짧은 꼬리 행을 피합니다.
    function calculateArtistRowSizes(count) {
      if (count <= 0) return [];
      if (count <= 6) return [count];
      const sizes = [];
      let remaining = count;
      while (remaining > 0) {
        sizes.push(Math.min(5, remaining));
        remaining -= Math.min(5, remaining);
      }
      const last = sizes[sizes.length - 1];
      if (last === 1 && sizes.length >= 2) {
        sizes[sizes.length - 2] += 1;
        sizes.pop();
      } else if (last === 2 && sizes.length >= 3) {
        sizes[sizes.length - 2] += 1;
        sizes[sizes.length - 3] += 1;
        sizes.pop();
      } else if (last === 2 && sizes.length === 2) {
        // 7개면 4+3, 12개는 위 분기에서 6+6이 됩니다.
        sizes[0] = Math.ceil(count / 2);
        sizes[1] = Math.floor(count / 2);
      }
      return sizes;
    }

    function updateArtistLayout() {
      const isLandscapeLayout = window.matchMedia('(orientation: landscape) and (min-width: 680px)').matches;
      artistTabs.classList.toggle('is-collapsed', !artistListExpanded);
      artistRows.forEach(row => {
        row.classList.toggle('is-selected-row', row.dataset.artistIds.split('|').includes(activeArtistId || ''));
      });
      const count = ARTIST_ORDER.length;
      const rowsVisible = artistListExpanded ? artistRows.length : 1;
      artistToggle.disabled = count <= 5;
      artistToggle.setAttribute('aria-expanded', String(artistListExpanded));
      artistToggleLabel.textContent = artistListExpanded
        ? '아티스트 접기'
        : `아티스트 전체 보기 · ${count}명`;
      artistToggle.style.visibility = count <= 5 ? 'hidden' : 'visible';

      // 초기 전체 목록은 아티스트 행 수에 맞춰 라이브러리 영역을 늘리고
      // 영상·곡 정보 영역을 조금씩 양보합니다. 선택 후 접으면 재생목록 높이가 회복됩니다.
      if (!isLandscapeLayout) {
        if (artistListExpanded) {
          // 모바일에서는 큰 빈 공간을 만들지 않도록 영상 행을 화면 높이 기준으로 제한합니다.
          // 확보한 높이는 곡 목록에 남겨 목록을 더 많이 표시합니다.
          const videoHeight = Math.max(22, 27 - Math.min(3, Math.max(0, rowsVisible - 1)) * 1.2);
          const trackHeight = Math.max(18, 19 - Math.min(3, Math.max(0, rowsVisible - 1)) * 0.4);
          appShell.style.gridTemplateRows = `minmax(34px, 5dvh) minmax(0, ${videoHeight}dvh) minmax(118px, ${trackHeight}dvh) minmax(0, 1fr)`;
        } else {
          appShell.style.gridTemplateRows = 'minmax(34px, 5dvh) minmax(0, 27dvh) minmax(118px, 19dvh) minmax(0, 1fr)';
        }
      } else {
        appShell.style.gridTemplateRows = '';
      }
    }

    function renderArtistButtons() {
      artistTabs.replaceChildren();
      artistButtons = [];
      artistRows = [];
      const rowSizes = calculateArtistRowSizes(ARTIST_ORDER.length);
      let offset = 0;

      rowSizes.forEach((rowSize, rowIndex) => {
        const row = document.createElement('div');
        row.className = 'artist-row';
        row.style.setProperty('--row-count', String(rowSize));
        const ids = ARTIST_ORDER.slice(offset, offset + rowSize);
        row.dataset.artistIds = ids.join('|');
        row.setAttribute('role', 'group');
        row.setAttribute('aria-label', `아티스트 ${rowIndex + 1}행`);

        ids.forEach(id => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'artist-button';
          button.dataset.artist = id;
          button.textContent = PLAYLISTS[id].label;
          button.setAttribute('aria-expanded', 'false');
          button.setAttribute('aria-controls', 'playlistPanel');
          button.addEventListener('click', () => openArtist(id));
          row.appendChild(button);
          artistButtons.push(button);
        });

        artistTabs.appendChild(row);
        artistRows.push(row);
        offset += rowSize;
      });

      if (ARTIST_ORDER.length === 0) {
        const placeholder = document.createElement('span');
        placeholder.className = 'artist-tabs-placeholder';
        placeholder.textContent = '등록된 아티스트가 없습니다.';
        artistTabs.appendChild(placeholder);
      }
      updateArtistLayout();
    }

    artistToggle.addEventListener('click', () => {
      artistListExpanded = !artistListExpanded;
      updateArtistLayout();
      // 목록을 펼쳤을 때 선택된 아티스트 행이 화면 안에 있도록 이동합니다.
      if (artistListExpanded && activeArtistId) {
        const selectedRow = artistRows.find(row => row.dataset.artistIds.split('|').includes(activeArtistId));
        selectedRow?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    });

    window.addEventListener('resize', updateArtistLayout, { passive: true });

    async function loadPlaylistsFromJson() {
      playlistStatus.textContent = 'PLAYLIST LOADING...';
      try {
        const response = await fetch(PLAYLIST_JSON_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status} ${response.statusText}`);

        let data;
        try {
          data = await response.json();
        } catch {
          throw new Error('JSON 구문을 읽을 수 없습니다. 쉼표와 큰따옴표를 확인하세요.');
        }

        const result = parsePlaylistJson(data);
        PLAYLISTS = result.playlists;
        ARTIST_ORDER = Object.keys(PLAYLISTS);
        playlistWarnings = result.warnings;
        playlistLoadError = null;
        artistListExpanded = true; // 최초 접속에서는 전체 아티스트 목록을 펼쳐 보여줍니다.
        renderArtistButtons();

        const trackCount = Object.values(PLAYLISTS).reduce((sum, list) => sum + list.songs.length, 0);
        const validTrackCount = Object.values(PLAYLISTS).reduce(
          (sum, list) => sum + list.songs.filter(song => song.videoIdValid).length, 0
        );
        playlistStatus.textContent = `PLAYLIST READY · ${trackCount} TRACKS` +
          (playlistWarnings.length ? ` · ${playlistWarnings.length} WARNINGS` : '');

        const firstArtistWithValidTrack = ARTIST_ORDER.find(id =>
          PLAYLISTS[id].songs.some(song => song.videoIdValid)
        );

        if (firstArtistWithValidTrack) {
          const firstSongIndex = PLAYLISTS[firstArtistWithValidTrack].songs.findIndex(song => song.videoIdValid);
          setCurrentTrack(firstArtistWithValidTrack, firstSongIndex, false);
          currentSubtitle.textContent = playlistWarnings.length
            ? `재생목록 로드 완료 · ${validTrackCount}곡 재생 가능 · ${playlistWarnings.length}개 항목 확인 필요`
            : `재생목록 로드 완료 · ${PLAYLISTS[firstArtistWithValidTrack].songs[firstSongIndex].title}`;
          playlistArtistName.textContent = `${PLAYLISTS[firstArtistWithValidTrack].label}의 노래`;
          renderSongs(firstArtistWithValidTrack);
        } else {
          currentTitle.textContent = trackCount ? '재생 가능한 영상이 없습니다' : '등록된 곡이 없습니다';
          currentSubtitle.textContent = playlistWarnings.length
            ? `${playlistWarnings.length}개 항목을 확인하세요. videoId는 일반적으로 YouTube 영상 ID 11자입니다.`
            : 'playlist.json의 artists 아래 songs 배열에 곡을 추가하세요.';
          const firstArtist = ARTIST_ORDER[0];
          playlistArtistName.textContent = `${PLAYLISTS[firstArtist].label}의 노래`;
          renderSongs(firstArtist);
        }

        if (playlistWarnings.length) {
          console.warn('[ume Opera] playlist.json 확인이 필요한 항목:', playlistWarnings);
        }
      } catch (error) {
        playlistLoadError = error instanceof Error ? error.message : String(error);
        playlistStatus.textContent = 'PLAYLIST LOAD FAILED';
        currentTitle.textContent = '재생목록을 불러오지 못했습니다';
        currentSubtitle.textContent = `${playlistLoadError} · URL/CORS 설정을 확인하세요.`;
        playlistArtistName.textContent = '재생목록 오류';
        playlistCount.textContent = 'ERROR';
        artistTabs.replaceChildren();
        const placeholder = document.createElement('span');
        placeholder.className = 'artist-tabs-placeholder';
        placeholder.textContent = '재생목록 로드 실패';
        artistTabs.appendChild(placeholder);
        artistButtons = [];
        renderSongs(null);
        console.error('[ume Opera] playlist.json 로드 실패:', error);
      }
    }

    function makeEmbedUrl(song, autoplay) {
      const params = new URLSearchParams({
        start: String(Math.max(0, Math.floor(Number(song.start) || 0))),
        playsinline: '1',
        rel: '0',
        autoplay: autoplay ? '1' : '0'
      });
      return `https://www.youtube-nocookie.com/embed/${encodeURIComponent(song.videoId)}?${params.toString()}`;
    }

    function setCurrentTrack(artistId, trackIndex, autoplay) {
      const playlist = PLAYLISTS[artistId];
      const song = playlist && playlist.songs[trackIndex];
      if (!song || !song.videoId) return;
      if (!song.videoIdValid) {
        currentSubtitle.textContent = `영상 ID 형식 오류 · ${song.videoId} (일반적인 YouTube 영상 ID는 11자입니다)`;
        return;
      }

      activeTrackKey = `${artistId}-${trackIndex}`;
      currentTitle.textContent = `${song.artist || playlist.artist} / ${song.title}`;
      currentSubtitle.textContent = `선택한 곡 · ${playlist.label} ${String(trackIndex + 1).padStart(2, '0')}`;
      player.src = makeEmbedUrl(song, autoplay);
      renderSongs(artistId);
    }

    function renderSongs(artistId) {
      const playlist = artistId ? PLAYLISTS[artistId] : null;
      songList.replaceChildren();

      if (!playlist || playlist.songs.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        if (playlistLoadError) {
          empty.textContent = `외부 재생목록을 불러오지 못했습니다. URL과 CORS 설정을 확인한 뒤 페이지를 새로고침하세요. (${playlistLoadError})`;
        } else {
          empty.textContent = '아직 등록된 곡이 없습니다. playlist.json의 해당 아티스트 songs 배열에 곡을 추가하세요.';
        }
        songList.appendChild(empty);
        playlistCount.textContent = '0 TRACKS';
        return;
      }

      playlistCount.textContent = `${playlist.songs.length} TRACK${playlist.songs.length === 1 ? '' : 'S'}`;
      playlist.songs.forEach((song, index) => {
        const key = `${artistId}-${index}`;
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'song-button' + (activeTrackKey === key ? ' is-active' : '');
        button.setAttribute('aria-pressed', String(activeTrackKey === key));
        button.disabled = !song.videoIdValid;
        if (!song.videoIdValid) button.title = `YouTube 영상 ID 또는 URL 확인 필요: ${song.videoIdInput || '(비어 있음)'}`;

        const number = document.createElement('span');
        number.className = 'song-number';
        number.textContent = String(index + 1).padStart(2, '0');

        const copy = document.createElement('span');
        copy.className = 'song-copy';
        const title = document.createElement('span');
        title.className = 'song-title';
        title.textContent = song.title;
        const artist = document.createElement('span');
        artist.className = 'song-artist';
        artist.textContent = song.artist || playlist.artist;
        copy.append(title, artist);

        if (!song.videoIdValid) {
          const warning = document.createElement('span');
          warning.className = 'song-warning';
          warning.textContent = '영상 ID 또는 링크 확인 필요';
          copy.appendChild(warning);
        }

        const state = document.createElement('span');
        state.className = 'song-state';
        state.setAttribute('aria-hidden', 'true');
        if (!song.videoIdValid) {
          state.textContent = '!';
        } else {
          state.innerHTML = activeTrackKey === key
            ? '<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><rect x="2" y="1" width="3" height="10" rx="1"></rect><rect x="7" y="1" width="3" height="10" rx="1"></rect></svg>'
            : '<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M3 1.8c0-.5.55-.8.98-.53l6.2 4.02a.85.85 0 0 1 0 1.42l-6.2 4.02A.65.65 0 0 1 3 10.18V1.8Z"></path></svg>';
        }

        button.append(number, copy, state);
        if (song.videoIdValid) button.addEventListener('click', () => setCurrentTrack(artistId, index, true));
        songList.appendChild(button);
      });
    }

    function openArtist(artistId) {
      if (!Object.prototype.hasOwnProperty.call(PLAYLISTS, artistId)) return;
      const alreadyOpen = activeArtistId === artistId && libraryZone.classList.contains('is-open');
      if (alreadyOpen) {
        libraryZone.classList.remove('is-open');
        activeArtistId = null;
        artistListExpanded = true;
        artistButtons.forEach(button => button.setAttribute('aria-expanded', 'false'));
        updateArtistLayout();
        return;
      }

      activeArtistId = artistId;
      libraryZone.classList.add('is-open');
      // 모바일에서는 아티스트 선택 후 한 행만 남겨 곡 목록 공간을 확보합니다.
      // 가로형 화면은 레이아웃 특성상 전체 아티스트 목록을 유지합니다.
      if (!window.matchMedia('(orientation: landscape) and (min-width: 680px)').matches) {
        artistListExpanded = false;
      }
      updateArtistLayout();
      artistButtons.forEach(button => {
        button.setAttribute('aria-expanded', String(button.dataset.artist === artistId));
      });
      playlistArtistName.textContent = `${PLAYLISTS[artistId].label}의 노래`;
      renderSongs(artistId);
      playlistInner.scrollTop = 0;
    }

    // 곡 정보는 외부 playlist.json에서 비동기로 불러옵니다.
    // 브라우저의 자동 재생 정책에 따라 곡을 눌러도 자동 재생이 제한될 수 있습니다.
    loadPlaylistsFromJson();
  </script>
</body>
</html>
